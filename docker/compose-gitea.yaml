# -- Eva Gitea (The Internal DevOps Hub) --
name: eva-gitea

networks:
  eva-net:
    external: true

services:
  # -- DATABASE: GITEA DB (PostgreSQL) --
  db:
    image: postgres:14
    container_name: eva-gitea-db
    restart: always
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    networks:
      - eva-net
    volumes:
      - /volume1/ros/eva/gitea/db:/var/lib/postgresql/data

  # -- GITEA: THE CORE GIT SERVICE --
  gitea:
    image: gitea/gitea:latest
    container_name: eva-gitea
    depends_on:
      - db
    networks:
      - eva-net
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=eva-gitea-db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
    volumes:
      - /volume1/ros/eva/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6060:3000"
      - "622:22"
    restart: always

  # -- RUNNER: LOCAL ACTIONS (Eva's CI) --
  act-runner:
    image: gitea/act_runner:latest
    container_name: eva-gitea-runner
    networks:
      - eva-net
    depends_on:
      - gitea
    volumes:
      - /volume1/ros/eva/runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITEA_INSTANCE_URL=http://eva-gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=DrzBSszEQKOAtnGE3Baxc5kfco44Ygz8G3yiIL6L
      - GITEA_RUNNER_NAME=eva-gitea-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://catthehacker/ubuntu:act-latest,ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04,ros-${ROS_DISTRO:-humble}:docker://ros:${ROS_DISTRO:-humble}
    restart: always
